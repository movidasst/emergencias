<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007b85">
<title>La Movida de SST Plus · Emergencias</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f8fafc;color:#00205b}
.loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
.card{width:min(430px,100%);background:white;border:1px solid #dbe4ea;border-radius:22px;padding:28px 22px;box-shadow:0 16px 40px rgba(0,32,91,.08)}
.bar{height:5px;border-radius:999px;background:linear-gradient(90deg,#ffcf00 0 33%,#00247d 33% 66%,#cf142b 66%);margin:0 0 20px}
h1{font-size:19px;margin:0}p{color:#64748b;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="loader"><div class="card"><div class="bar"></div><h1>La Movida de SST Plus</h1><p id="msg">Cargando la herramienta de emergencias…</p></div></div>
<script>
(async()=>{
 const archivos=[
  'app/v20260815/parte01.txt',
  'app/v20260815/parte02.txt',
  'app/v20260815/parte03.txt',
  'app/v20260815/parte04.txt',
  'app/v20260815/parte05.txt',
  'app/v20260815/parte06.txt'
 ];
 const partes=await Promise.all(archivos.map(async u=>{
   const r=await fetch(u,{cache:'no-store'});
   if(!r.ok) throw new Error(`No se pudo cargar ${u}`);
   return r.text();
 }));
 const b64=partes.join('').replace(/\s/g,'');
 const bin=atob(b64);
 const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if(typeof DecompressionStream!=='function') throw new Error('Actualiza el navegador para abrir la aplicación.');
 const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 document.open();document.write(html);document.close();
})().catch(err=>{
 console.error(err);
 document.getElementById('msg').textContent='No se pudo cargar la aplicación. Recarga la página. '+(err?.message||'');
});
</script>
</body>
</html>
