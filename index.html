<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#007b85">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Centro de Inteligencia Situacional SST para Venezuela de La Movida de SST Plus: señales, impacto preventivo, emergencias y continuidad operacional.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_VE">
  <meta property="og:site_name" content="La Movida de SST Plus">
  <meta property="og:url" content="https://emergencias.movidasst.com/">
  <meta property="og:title" content="Centro de Inteligencia Situacional SST | Venezuela">
  <meta property="og:description" content="Venezuela primero: monitoreo situacional, impacto potencial SST y apoyo a decisiones preventivas.">
  <link rel="canonical" href="https://emergencias.movidasst.com/">
  <title>Centro de Inteligencia Situacional SST | La Movida SST Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#00205b;--teal:#007b85;--green:#70ad47;--yellow:#ffb600;--bg:#f8fafc;--line:#dbe5ea;--text:#475569}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Outfit,system-ui,sans-serif;color:var(--text)}
    body:before{content:"";position:fixed;z-index:1000;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--navy),var(--teal),var(--green),var(--yellow));pointer-events:none}
    .modulebar{height:64px;padding:8px 12px 7px;margin-top:4px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 8px 24px rgba(15,23,42,.06);position:relative;z-index:20}
    .brand{min-width:0}.brand small{display:block;color:var(--teal);font-size:9px;font-weight:800;letter-spacing:.11em}.brand strong{display:block;color:var(--navy);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .switch{display:flex;align-items:center;gap:6px;padding:4px;background:#eef4f6;border:1px solid #e0e9ed;border-radius:14px;flex:0 0 auto}
    .switch a{text-decoration:none;min-height:38px;padding:8px 11px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;color:#64748b;font-size:11px;font-weight:800;white-space:nowrap}
    .switch a.active{background:#fff;color:var(--navy);box-shadow:0 4px 12px rgba(15,23,42,.08)}
    .switch a:not(.active):hover{color:var(--teal);background:rgba(255,255,255,.55)}
    iframe{display:block;width:100%;height:calc(100dvh - 68px);border:0;background:#f8fafc}
    @media(max-width:680px){.modulebar{height:70px;align-items:center}.brand strong{font-size:12px;max-width:135px}.brand small{font-size:8px}.switch{gap:3px;padding:3px}.switch a{padding:7px 8px;font-size:10px;min-height:38px}.switch a span.label-long{display:none}iframe{height:calc(100dvh - 74px)}}
  </style>
</head>
<body>
  <header class="modulebar" aria-label="Navegación entre módulos de Emergencias">
    <div class="brand">
      <small>LA MOVIDA DE SST PLUS</small>
      <strong>Emergencias · Venezuela</strong>
    </div>
    <nav class="switch" aria-label="Cambiar módulo">
      <a class="active" href="/" aria-current="page">📡 <span>Inteligencia</span></a>
      <a href="/pe/">📋 <span class="label-long">Plan de </span><span>Emergencias</span></a>
    </nav>
  </header>
  <iframe id="moduleFrame" src="/monitor/?v=20260817-1727" title="Centro de Inteligencia Situacional SST Venezuela" loading="eager"></iframe>
  <script>
    const frame=document.getElementById('moduleFrame');
    frame.addEventListener('load',()=>{
      try{
        const d=frame.contentDocument;
        const top=d.querySelector('.back-btn');
        if(top){top.href='/pe/';top.innerHTML='<span aria-hidden="true">↔</span><span>Plan de Emergencias</span>';top.setAttribute('aria-label','Abrir Plan de Emergencias');}
        const foot=d.querySelector('.footer-back');
        if(foot){foot.href='/pe/';foot.textContent='↔ Abrir Plan de Emergencias';}

        // Hotfix con URL versionada: evita que Chrome móvil reutilice la semántica anterior.
        if(!d.querySelector('script[data-semantic-v2="1"]')){
          const s=d.createElement('script');
          s.src='/monitor/signal-semantics-v2.js?v=20260817-1727';
          s.dataset.semanticV2='1';
          s.async=false;
          d.body.appendChild(s);
        }
      }catch(e){console.warn('Navegación/semántica interna no ajustada',e)}
    });
  </script>
</body>
</html>
