 const flujoCorregido="  function projectVulnerabilityRows(p=getLocalProject()){\n    if(!p)return [];\n    const assessments=p.vulnerability_assessments||[];\n    const responses=p.vulnerability_responses||[];\n    return assessments.map(a=>{\n      const rr=responses.filter(r=>r.assessment_id===a.id && !r.not_applicable);\n      const scores=rr.map(r=>Number(r.score||r.response_numeric||0)).filter(Boolean);\n      const avg=scores.length?scores.reduce((s,n)=>s+n,0)/scores.length:0;\n      const ph=(p.selected_hazards||[]).find(x=>x.id===a.project_hazard_id);\n      const hazard=state.hazardCatalog.find(x=>x.id===ph?.hazard_id);\n      const area=(p.areas||[]).find(x=>x.id===a.area_id);\n      const criterion=state.vulnCriteria.find(x=>x.id===a.criterion_id);\n      const expected=Array.isArray(a.expected_question_ids)?a.expected_question_ids.length:0;\n      return {\n        id:a.id,project_hazard_id:a.project_hazard_id,area_id:a.area_id||null,\n        hazard_name:hazard?.name_es||\"Amenaza\",area_name:area?.name||\"Sede general\",\n        dimension_name:a.manual_review ? (a.manual_review_label||\"Valoración profesional complementaria\") : (criterion?.name_es||criterion?.code||\"Dimensión\"),\n        vulnerability_level:vulnerabilityLevel(scores),exposure_level:\"unknown\",\n        absorption_capacity:\"—\",dependency_level:\"—\",average_score:avg||null,\n        max_score:scores.length?Math.max(...scores):null,responses_count:rr.length,\n        expected_count:expected,incomplete:expected>0 && rr.length<expected,\n        specialist_review_required:!!hazard?.requires_specialist_review || !!a.manual_review\n      };\n    });\n  }\n\n  function buildLocalMatrix(){\n    const p=getLocalProject();\n    if(!p)return [];\n    const vuln=projectVulnerabilityRows(p);\n    const caps=p.capability_assessments||[];\n    const severity={low:1,moderate:2,high:3,critical:4};\n    const vulnScore={unknown:0,low:1,moderate:2,high:3,very_high:4};\n    const classScore={base:1,severe:3,maximum_credible:4};\n    const intensityScore={unknown:0,low:1,medium:2,high:3,extreme:4};\n\n    return (p.scenarios||[]).map(s=>{\n      const ph=(p.selected_hazards||[]).find(x=>x.id===s.project_hazard_id);\n      const hazard=state.hazardCatalog.find(x=>x.id===ph?.hazard_id);\n      const area=(p.areas||[]).find(x=>x.id===(s.area_id||ph?.area_id));\n      const vv=vuln.filter(v=>v.project_hazard_id===s.project_hazard_id && (!s.area_id || v.area_id===s.area_id || v.area_id==null));\n      const highest=[...vv].sort((a,b)=>(vulnScore[b.vulnerability_level]||0)-(vulnScore[a.vulnerability_level]||0))[0]?.vulnerability_level||\"unknown\";\n      const cc=caps.filter(x=>x.scenario_id===s.id);\n      const gaps=cc.filter(x=>!x.not_applicable&&x.gap_exists);\n      const highCritical=gaps.filter(x=>[\"high\",\"critical\"].includes(x.gap_severity)).length;\n      const gapScore=Math.max(0,...gaps.map(x=>severity[x.gap_severity]||0));\n      const consequenceScore=Math.max(Number(s.consequence_people_level||0),Number(s.consequence_infrastructure_level||0),Number(s.consequence_operations_level||0),Number(s.consequence_environment_level||0));\n      const potentialScore=intensityScore[ph?.intensity_level]||0;\n      let score=Math.max(vulnScore[highest]||0,classScore[s.scenario_class]||1,gapScore,consequenceScore,potentialScore);\n      if((vulnScore[highest]||0)>=3 && gapScore>=3) score=4;\n      const priority=score>=4?\"critical\":score>=3?\"high\":score>=2?\"moderate\":\"low\";\n      const incompleteScenario=!s.initiating_event || !s.evolution || !(s.consequence_people||s.consequence_operations||s.consequence_infrastructure||s.consequence_environment);\n      const infoWarning=vv.length===0 || vv.some(v=>v.incomplete) || incompleteScenario;\n      return {\n        scenario_id:s.id,scenario_code:s.code,scenario_title:s.title,scenario_class:s.scenario_class,\n        hazard_name:hazard?.name_es||\"Amenaza\",area_name:area?.name||\"Toda la sede\",\n        hi
