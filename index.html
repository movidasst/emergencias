<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#007b85">
<title>La Movida de SST Plus · Emergencias</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f8fafc;color:#00205b}
.loader{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;box-sizing:border-box}
.card{width:min(430px,100%);background:white;border:1px solid #dbe4ea;border-radius:22px;padding:28px 22px;box-shadow:0 16px 40px rgba(0,32,91,.08)}
.bar{height:5px;border-radius:999px;background:linear-gradient(90deg,#ffcf00 0 33%,#00247d 33% 66%,#cf142b 66%);margin:0 0 20px}
h1{font-size:19px;margin:0}p{color:#64748b;font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="loader"><div class="card"><div class="bar"></div><h1>La Movida de SST Plus</h1><p id="msg">Cargando la herramienta de emergencias…</p></div></div>
<script>
(async()=>{
 const archivos=[
  'app/v20260815/parte01.txt',
  'app/v20260815/parte02.txt',
  'app/v20260815/parte03.txt',
  'app/v20260815/parte04.txt',
  'app/v20260815/parte05.txt',
  'app/v20260815/parte06.txt'
 ];
 const partes=await Promise.all(archivos.map(async u=>{
   const r=await fetch(u,{cache:'no-store'});
   if(!r.ok) throw new Error(`No se pudo cargar ${u}`);
   return r.text();
 }));
 const b64=partes.join('').replace(/\s/g,'');
 const bin=atob(b64);
 const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if(typeof DecompressionStream!=='function') throw new Error('Actualiza el navegador para abrir la aplicación.');
 let html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 const flujoCorregido="  function projectVulnerabilityRows(p=getLocalProject()){\n    if(!p)return [];\n    const assessments=p.vulnerability_assessments||[];\n    const responses=p.vulnerability_responses||[];\n    return assessments.map(a=>{\n      const rr=responses.filter(r=>r.assessment_id===a.id && !r.not_applicable);\n      const scores=rr.map(r=>Number(r.score||r.response_numeric||0)).filter(Boolean);\n      const avg=scores.length?scores.reduce((s,n)=>s+n,0)/scores.length:0;\n      const ph=(p.selected_hazards||[]).find(x=>x.id===a.project_hazard_id);\n      const hazard=state.hazardCatalog.find(x=>x.id===ph?.hazard_id);\n      const area=(p.areas||[]).find(x=>x.id===a.area_id);\n      const criterion=state.vulnCriteria.find(x=>x.id===a.criterion_id);\n      const expected=Array.isArray(a.expected_question_ids)?a.expected_question_ids.length:0;\n      return {\n        id:a.id,project_hazard_id:a.project_hazard_id,area_id:a.area_id||null,\n        hazard_name:hazard?.name_es||\"Amenaza\",area_name:area?.name||\"Sede general\",\n        dimension_name:a.manual_review ? (a.manual_review_label||\"Valoración profesional complementaria\") : (criterion?.name_es||criterion?.code||\"Dimensión\"),\n        vulnerability_level:vulnerabilityLevel(scores),exposure_level:\"unknown\",\n        absorption_capacity:\"—\",dependency_level:\"—\",average_score:avg||null,\n        max_score:scores.length?Math.max(...scores):null,responses_count:rr.length,\n        expected_count:expected,incomplete:expected>0 && rr.length<expected,\n        specialist_review_required:!!hazard?.requires_specialist_review || !!a.manual_review\n      };\n    });\n  }\n\n  function buildLocalMatrix(){\n    const p=getLocalProject();\n    if(!p)return [];\n    const vuln=projectVulnerabilityRows(p);\n    const caps=p.capability_assessments||[];\n    const severity={low:1,moderate:2,high:3,critical:4};\n    const vulnScore={unknown:0,low:1,moderate:2,high:3,very_high:4};\n    const classScore={base:1,severe:3,maximum_credible:4};\n    const intensityScore={unknown:0,low:1,medium:2,high:3,extreme:4};\n\n    return (p.scenarios||[]).map(s=>{\n      const ph=(p.selected_hazards||[]).find(x=>x.id===s.project_hazard_id);\n      const hazard=state.hazardCatalog.find(x=>x.id===ph?.hazard_id);\n      const area=(p.areas||[]).find(x=>x.id===(s.area_id||ph?.area_id));\n      const vv=vuln.filter(v=>v.project_hazard_id===s.project_hazard_id && (!s.area_id || v.area_id===s.area_id || v.area_id==null));\n      const highest=[...vv].sort((a,b)=>(vulnScore[b.vulnerability_level]||0)-(vulnScore[a.vulnerability_level]||0))[0]?.vulnerability_level||\"unknown\";\n      const cc=caps.filter(x=>x.scenario_id===s.id);\n      const gaps=cc.filter(x=>!x.not_applicable&&x.gap_exists);\n      const highCritical=gaps.filter(x=>[\"high\",\"critical\"].includes(x.gap_severity)).length;\n      const gapScore=Math.max(0,...gaps.map(x=>severity[x.gap_severity]||0));\n      const consequenceScore=Math.max(Number(s.consequence_people_level||0),Number(s.consequence_infrastructure_level||0),Number(s.consequence_operations_level||0),Number(s.consequence_environment_level||0));\n      const potentialScore=intensityScore[ph?.intensity_level]||0;\n      let score=Math.max(vulnScore[highest]||0,classScore[s.scenario_class]||1,gapScore,consequenceScore,potentialScore);\n      if((vulnScore[highest]||0)>=3 && gapScore>=3) score=4;\n      const priority=score>=4?\"critical\":score>=3?\"high\":score>=2?\"moderate\":\"low\";\n      const incompleteScenario=!s.initiating_event || !s.evolution || !(s.consequence_people||s.consequence_operations||s.consequence_infrastructure||s.consequence_environment);\n      const infoWarning=vv.length===0 || vv.some(v=>v.incomplete) || incompleteScenario;\n      return {\n        scenario_id:s.id,scenario_code:s.code,scenario_title:s.title,scenario_class:s.scenario_class,\n        hazard_name:hazard?.name_es||\"Amenaza\",area_name:area?.name||\"Toda la sede\",\n        highest_vulnerability_level:highest,capability_gaps:gaps.length,high_critical_gaps:highCritical,\n        priority_level:priority,priority_score:score,consequence_score:consequenceScore,hazard_potential_score:potentialScore,\n        consequence_people:s.consequence_people||\"\",consequence_operations:s.consequence_operations||\"\",\n        consequence_infrastructure:s.consequence_infrastructure||\"\",consequence_environment:s.consequence_environment||\"\",\n        initiating_event:s.initiating_event||\"\",evolution:s.evolution||\"\",escalation:s.escalation||\"\",\n        cascade_description:s.cascade_description||\"\",weak_critical_barriers:0,\n        specialist_review_required:!!hazard?.requires_specialist_review,\n        information_warning:infoWarning\n      };\n    }).sort((a,b)=>b.priority_score-a.priority_score);\n  }\n\n  function scenarioCompleteness(s){\n    const consequenceText=(s?.consequence_people||s?.consequence_operations||s?.consequence_infrastructure||s?.consequence_environment);\n    const consequenceLevel=Math.max(Number(s?.consequence_people_level||0),Number(s?.consequence_infrastructure_level||0),Number(s?.consequence_operations_level||0),Number(s?.consequence_environment_level||0));\n    const fields=[s?.initiating_event,s?.exposed_elements,s?.evolution,(consequenceText&&consequenceLevel>0)?\"ok\":\"\"];\n    const done=fields.filter(x=>String(x||'').trim()).length;\n    return {done,total:4,pct:Math.round(done/4*100),complete:done===4};\n  }\n\n  function workflowStatus(){\n    const p=getLocalProject();\n    if(!p){\n      return {project:false,hazards:false,vulnerability:false,scenarios:false,capabilities:false,matrix:false,report:false,warnings:0,\n        details:{hazards:'0 seleccionadas',vulnerability:'0 evaluadas',scenarios:'0 completos',capabilities:'0 evaluados',matrix:'Sin matriz'}};\n    }\n    const hazards=p.selected_hazards||[];\n    const characterized=hazards.filter(h=>h.site_specific_description && h.occurrence_level && h.occurrence_level!=='unknown' && h.intensity_level && h.intensity_level!=='unknown');\n    const completedHazards=hazards.filter(h=>!!h.vulnerability_completed_at);\n    const scenarios=p.scenarios||[];\n    const completeScenarios=scenarios.filter(s=>scenarioCompleteness(s).complete);\n    const cap=p.capability_assessments||[];\n    const capabilityTotal=state.capabilities.length;\n    const capsCovered=scenarios.filter(s=>{\n      const rows=cap.filter(c=>c.scenario_id===s.id);\n      if(!capabilityTotal)return false;\n      const valid=rows.filter(c=>c.not_applicable || (String(c.required_capacity||'').trim() && String(c.available_capacity||'').trim()));\n      return new Set(valid.map(c=>c.capability_id)).size>=capabilityTotal;\n    });\n    const matrix=buildLocalMatrix();\n    const warnings=matrix.filter(m=>m.information_warning).length;\n    const projectOK=!!p.site?.name && !!p.site?.main_activity && !!p.code && !!p.title;\n    const hazardsOK=hazards.length>0 && characterized.length===hazards.length;\n    const vulnerabilityOK=hazards.length>0 && completedHazards.length===hazards.length;\n    const scenariosOK=scenarios.length>0 && completeScenarios.length===scenarios.length;\n    const capabilitiesOK=scenarios.length>0 && capsCovered.length===scenarios.length;\n    const matrixComputed=scenariosOK && matrix.length===scenarios.length;\n    const matrixReviewed=!!p.matrix_reviewed_at;\n    const matrixOK=matrixComputed && capabilitiesOK && matrixReviewed;\n    return {\n      project:projectOK,hazards:hazardsOK,vulnerability:vulnerabilityOK,scenarios:scenariosOK,\n      capabilities:capabilitiesOK,matrix:matrixOK,report:matrixOK,warnings,\n      details:{\n        hazards:`${characterized.length}/${hazards.length} caracterizadas`,\n        vulnerability:`${completedHazards.length}/${hazards.length} amenazas evaluadas`,\n        scenarios:`${completeScenarios.length}/${scenarios.length} escenarios completos`,\n        capabilities:`${capsCovered.length}/${scenarios.length} escenarios con capacidades completas`,\n        matrix:`${matrix.length} escenario(s) integrados · ${warnings} advertencia(s)${matrixReviewed?' · revisión confirmada':' · falta confirmar revisión'}`\n      }\n    };\n  }\n\n  function routeClass";
 const bloqueRoto=/  function projectVulnerabilityRows\(p=getLocalProject\(\)\)\{[\s\S]*?  function routeClass/;
 if(!bloqueRoto.test(html)) throw new Error('No se encontró el bloque técnico que debía corregirse.');
 html=html.replace(bloqueRoto,flujoCorregido);

 const enlaceBase='    if($(\"goScenariosBtn\")) $(\"goScenariosBtn\").onclick=()=>navigateWorkflow(\"scenarios\");';
 if(html.includes(enlaceBase)){
   html=html.replace(enlaceBase,`    if($(\"saveVulnerabilityAndContinueBtn\")) $(\"saveVulnerabilityAndContinueBtn\").onclick=saveAllVulnerabilityAndContinue;
    if($(\"backToHazardsBtn\")) $(\"backToHazardsBtn\").onclick=()=>showPage(\"hazards\");
    if($(\"backToVulnerabilityBtn\")) $(\"backToVulnerabilityBtn\").onclick=()=>showPage(\"vulnerability\");
    if($(\"vulnHazardSelect\")) $(\"vulnHazardSelect\").onchange=async()=>{await loadVulnerabilityInstrument();};
    if($(\"vulnAreaSelect\")) $(\"vulnAreaSelect\").onchange=async()=>{await loadVulnerabilityInstrument();};
    if($(\"goScenariosBtn\")) $(\"goScenariosBtn\").onclick=()=>navigateWorkflow(\"scenarios\");`);
 }
 html=html.replaceAll('Evalúa cada amenaza frente al área expuesta y documenta evidencia.','Evalúa cada amenaza frente al área expuesta y justifica la valoración.');
 document.open();document.write(html);document.close();
})().catch(err=>{
 console.error(err);
 document.getElementById('msg').textContent='No se pudo cargar la aplicación. Recarga la página. '+(err?.message||'');
});
</script>
</body>
</html>
