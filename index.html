  <style>
    :root{--navy:#00205b;--teal:#007b85;--green:#70ad47;--yellow:#ffb600;--bg:#f8fafc;--line:#dbe5ea;--text:#475569}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Outfit,system-ui,sans-serif;color:var(--text)}
    body:before{content:"";position:fixed;z-index:1000;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--navy),var(--teal),var(--green),var(--yellow));pointer-events:none}
    .modulebar{height:92px;padding:10px 16px 9px;margin-top:4px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 28px rgba(15,23,42,.07);position:relative;z-index:20}
    .brand{min-width:0;display:flex;align-items:center;gap:14px}.brand-logo{width:76px;height:76px;flex:0 0 76px;display:block;object-fit:contain;background:transparent;border:0;border-radius:0;filter:drop-shadow(0 12px 15px rgba(0,32,91,.24)) drop-shadow(0 0 9px rgba(0,184,196,.28));animation:movidaSealFloat 4.8s ease-in-out infinite;transition:transform .28s ease,filter .28s ease}.brand-logo:hover{transform:translateY(-3px) scale(1.055);filter:drop-shadow(0 16px 20px rgba(0,32,91,.30)) drop-shadow(0 0 14px rgba(0,196,210,.42))}.brandcopy{min-width:0}.brand small{display:block;color:var(--teal);font-size:9px;font-weight:800;letter-spacing:.11em}.brand h1{display:block;margin:2px 0 0;color:var(--navy);font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .switch{display:flex;align-items:center;gap:6px;padding:4px;background:#eef4f6;border:1px solid #e0e9ed;border-radius:14px;flex:0 0 auto}
    .switch a{text-decoration:none;min-height:38px;padding:8px 11px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;color:#64748b;font-size:11px;font-weight:800;white-space:nowrap}
    .switch a.active{background:#fff;color:var(--navy);box-shadow:0 4px 12px rgba(15,23,42,.08)}
    .switch a:not(.active):hover{color:var(--teal);background:rgba(255,255,255,.55)}
    iframe{display:block;width:100%;height:calc(100dvh - 96px);border:0;background:#f8fafc}@keyframes movidaSealFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(.35deg)}}
    @media(max-width:680px){.modulebar{height:84px;align-items:center}.brand{gap:9px}.brand-logo{width:62px;height:62px;flex-basis:62px}.brand h1{font-size:11px;max-width:105px}.brand small{font-size:7px;letter-spacing:.06em}.switch{gap:3px;padding:3px}.switch a{padding:7px 8px;font-size:10px;min-height:38px}.switch a span.label-long{display:none}iframe{height:calc(100dvh - 88px)}}
@media(prefers-reduced-motion:reduce){.brand-logo{animation:none!important}}

  <script>
    const frame=document.getElementById('moduleFrame');
    frame.addEventListener('load',()=>{
      try{
        const d=frame.contentDocument;
        const top=d.querySelector('.back-btn');
        if(top){top.href='/pe/';top.innerHTML='<span aria-hidden="true">↔</span><span>Plan de Emergencias</span>';top.setAttribute('aria-label','Abrir Plan de Emergencias');}
        const foot=d.querySelector('.footer-back');
        if(foot){foot.href='/pe/';foot.textContent='↔ Abrir Plan de Emergencias';}

        // Hotfix con URL versionada: evita que Chrome móvil reutilice la semántica anterior.
        if(!d.querySelector('script[data-semantic-v2="1"]')){
          const s=d.createElement('script');
          s.src='/monitor/signal-semantics-v2.js?v=20260919-r5';
          s.dataset.semanticV2='1';
          s.async=false;
          d.body.appendChild(s);
        }
      }catch(e){console.warn('Navegación/semántica interna no ajustada',e)}
    });
  </script>
