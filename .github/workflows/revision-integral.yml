name: Verificación de identidad Emergencias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-identidad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar sello oficial R10
        run: |
          test -f assets/sello-movida-r10.png
          grep -q 'assets/sello-movida-r10.png' index.html
          grep -q 'assets/sello-movida-r10.png' pe/index.html
          grep -q 'assets/sello-movida-r10.png' monitor/index.html
          ! grep -R -n '1MjVa3JxeKC95xEdlcZ5ZFMCKlatbrU2s' index.html pe monitor site*.webmanifest || exit 1
          echo "Identidad R10 verificada."
