<script>
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const DB_KEY="movida_emergency_projects_v4",OLD_KEY="movida_emergency_projects_v3",MEMBER_KEY="movida_emergency_member";
const SB_URL="https://lfdmbkzghnwvsapxypvt.supabase.co",SB_KEY="sb_publishable_bRnkA6PA8-v073nrw9zxiQ_8rVGiOn1";
const sb=window.supabase?.createClient(SB_URL,SB_KEY);
const STEPS=[
 {id:"home",n:"Inicio",sub:"Resumen del plan"},
 {id:"identity",n:"Centro de trabajo",sub:"Datos y caracterización"},
 {id:"hazards",n:"Amenazas",sub:"Qué puede ocurrir"},
 {id:"scenarios",n:"Escenarios",sub:"Cómo puede desarrollarse"},
 {id:"resources",n:"Recursos",sub:"Capacidades disponibles"},
 {id:"organization",n:"Organización",sub:"Roles y comunicaciones"},
 {id:"procedures",n:"Procedimientos",sub:"Antes, durante y después"},
 {id:"osiris",n:"OSIRIS",sub:"Mapa y evacuación"},
 {id:"drills",n:"Preparación",sub:"Capacitación y simulacros"},
 {id:"review",n:"Revisar y descargar",sub:"Documento final"}
];
const HAZARDS=[
 ["incendio","Incendio","Combustibles, instalaciones eléctricas, trabajos en caliente o procesos térmicos."],
 ["explosion","Explosión","Gases, vapores, polvo combustible, recipientes presurizados o reacción química."],
 ["quimica","Derrame o fuga química","Liberación de sustancias que pueda afectar personas, ambiente u operación."],
 ["gas","Fuga de gas","Escape de gas inflamable, tóxico o asfixiante."],
 ["electrica","Emergencia eléctrica","Arco eléctrico, cortocircuito, electrocución o falla energética crítica."],
 ["medica","Emergencia médica","Lesión grave, pérdida de conciencia, intoxicación u otra urgencia de salud."],
 ["sismo","Sismo","Movimiento del terreno con posible caída de objetos o daño estructural."],
 ["inundacion","Inundación","Ingreso o acumulación de agua que afecte personas, equipos o accesos."],
 ["clima","Evento meteorológico","Viento, tormenta, calor extremo, lluvias intensas u otra condición severa."],
 ["estructural","Falla estructural","Daño o colapso parcial de estructura, techo, estantería o excavación."],
 ["violencia","Amenaza externa","Violencia, intrusión, amenaza de bomba o alteración del orden."],
 ["servicios","Falla de servicios","Interrupción crítica de electricidad, agua, comunicaciones, ventilación o proceso."]
];
const RESOURCE_TYPES=["Extintor","Alarma","Detector","Botiquín","Camilla","Ducha/lavaojos","Kit de derrames","Iluminación de emergencia","Red contra incendios","Equipo de comunicación","Otro"];
const ROLE_TYPES=["Coordinación de la emergencia","Alarma y comunicaciones","Evacuación","Primeros auxilios","Control inicial del evento","Apoyo a personas que requieren asistencia","Control de acceso","Enlace externo"];
const MARKERS={exit:["Salida","exit","S"],ext:["Extintor","ext","E"],meet:["Punto de encuentro","meet","P"],hazard:["Zona peligrosa","hazard","!"],firstaid:["Primeros auxilios","firstaid","+"]};
let state={member:null,projects:[],project:null,step:"home",mapTool:"exit"};
const blankProject=()=>({id:"p"+Date.now(),created:new Date().toISOString(),updated:new Date().toISOString(),identity:{},hazards:[],scenarios:[],resources:[],roles:[],procedures:{},map:{image:"",markers:[]},drills:{},reviewed:false});
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.add("hidden"),2800)}
function load(){try{state.projects=JSON.parse(localStorage.getItem(DB_KEY)||"null")||[];if(!state.projects.length){const old=JSON.parse(localStorage.getItem(OLD_KEY)||"[]");if(old.length) state.projects=old.map(migrateOld)}}catch{state.projects=[]}state.project=state.projects[0]||null}
function migrateOld(p){return{...blankProject(),id:p.id||("p"+Date.now()),identity:{name:p.title||"",code:p.code||"",company:p.org?.name||"",site:p.site?.name||"",address:[p.site?.city,p.site?.state_region].filter(Boolean).join(", "),activity:p.site?.main_activity||"",workers:p.site?.max_occupancy||""},hazards:(p.selected_hazards||[]).map((h,i)=>({id:h.id||"h"+i,type:"otro",name:h.name||"Amenaza registrada",area:h.area_id||"",cause:h.site_specific_description||"",controls:h.existing_controls||""})),scenarios:(p.scenarios||[]).map(s=>({...s,name:s.title||"",event:s.initiating_event||"",exposed:s.exposed_elements||""}))}}
function save(){if(!state.project)return;state.project.updated=new Date().toISOString();const i=state.projects.findIndex(p=>p.id===state.project.id);if(i>=0)state.projects[i]=state.project;else state.projects.unshift(state.project);localStorage.setItem(DB_KEY,JSON.stringify(state.projects));$("saveState").textContent="Cambios guardados";renderSteps()}
function ensureProject(){if(!state.project){state.project=blankProject();state.projects.unshift(state.project);save()}return state.project}
function complete(id,p=state.project){if(!p)return false;switch(id){case"identity":return !!(p.identity?.company&&p.identity?.site&&p.identity?.activity&&p.identity?.workers);case"hazards":return p.hazards?.length>0;case"scenarios":return p.scenarios?.length>0;case"resources":return p.resources?.length>0;case"organization":return p.roles?.length>=3;case"procedures":return Object.keys(p.procedures||{}).some(k=>p.procedures[k]?.during);case"osiris":return p.map?.markers?.some(m=>m.type==="exit")&&p.map?.markers?.some(m=>m.type==="meet");case"drills":return !!(p.drills?.frequency&&p.drills?.nextDate);case"review":return !!p.reviewed;default:return false}}
function pct(){return Math.round(STEPS.slice(1).filter(s=>complete(s.id)).length/(STEPS.length-1)*100)}
function renderSteps(){$("steps").innerHTML=STEPS.map((s,i)=>`<button class="step ${state.step===s.id?"active":""} ${complete(s.id)?"done":""}" data-step="${s.id}"><span class="stepnum">${complete(s.id)?"✓":i||"•"}</span><span class="steplabel"><b>${esc(s.n)}</b><small>${esc(s.sub)}</small></span><span class="check">${complete(s.id)?"●":""}</span></button>`).join("");$("progressText").textContent=pct()+"% completado";$("progressBar").style.width=pct()+"%";document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>go(b.dataset.step))}
function go(id){if(id!=="home")ensureProject();state.step=id;render()}
function guide(title,text){return `<div class="guide"><span class="guideicon">?</span><div><b>${title}</b><p>${text}</p></div></div>`}
function head(k,title,text){return `<div class="pagehead"><div><span class="eyebrow">Paso ${k} de 9</span><h1>${title}</h1><p>${text}</p></div><button class="help" data-help="1" aria-label="Ayuda">?</button></div>`}
function nav(prev,next,label="Guardar y continuar"){return `<div class="navactions"><button class="btn" data-go="${prev}">← Anterior</button><button class="btn primary" data-go="${next}">${label} →</button></div>`}
function render(){renderSteps();const m=$("main");m.innerHTML=page(state.step);bind();window.scrollTo({top:0,behavior:"smooth"})}
function page(id){switch(id){case"home":return home();case"identity":return identity();case"hazards":return hazards();case"scenarios":return scenarios();case"resources":return resources();case"organization":return organization();case"procedures":return procedures();case"osiris":return osiris();case"drills":return drills();case"review":return review()}return home()}
function home(){const p=state.project;return `<section class="homehero"><span class="eyebrow">PREVENCIÓN, PREPARACIÓN Y RESPUESTA</span><h1>Construye tu Plan de Emergencia Laboral</h1><p>Una ruta guiada para comprender qué puede ocurrir, organizar la respuesta y generar un documento útil para tu centro de trabajo.</p><div class="actions"><button class="btn" id="startBtn">${p?"Continuar mi plan":"Crear mi plan"}</button><button class="btn soft" id="plansHomeBtn">Ver mis planes</button></div></section>
<div class="metrics"><div class="metric"><b>${p?pct():0}%</b><span>Avance del plan activo</span></div><div class="metric"><b>${p?.hazards?.length||0}</b><span>Amenazas identificadas</span></div><div class="metric"><b>${p?.scenarios?.length||0}</b><span>Escenarios desarrollados</span></div></div>
<section class="panel" style="margin-top:15px"><h2>Una secuencia que convierte información en decisiones</h2><p class="intro">No necesitas comenzar con un documento en blanco. Cada paso explica qué debes analizar y utiliza tus respuestas en el plan final.</p><div class="route"><div><b>Conoce el lugar</b><small>Caracteriza actividad, personas, áreas y condiciones.</small></div><div><b>Construye escenarios</b><small>Relaciona amenazas, exposición y consecuencias.</small></div><div><b>Prepara la respuesta</b><small>Define recursos, responsables, procedimientos y evacuación.</small></div><div><b>Usa OSIRIS</b><small>Construye el mapa de emergencia como parte del plan.</small></div><div><b>Practica y mejora</b><small>Programa formación, simulacros y acciones correctivas.</small></div><div><b>Genera el documento</b><small>Revisa faltantes y descarga el plan completo.</small></div></div></section>`}
function identity(){const x=state.project.identity||{};return `${head(1,"Conoce el centro de trabajo","El plan debe responder a las condiciones reales de la organización, no a una plantilla genérica.")}${guide("¿Qué buscamos en este paso?","Definir dónde aplica el plan, qué actividades se realizan, cuántas personas pueden estar presentes y qué condiciones especiales deben considerarse.")}
<section class="panel"><h2>Identificación</h2><div class="grid g2">
<div><label>Empresa o institución *</label><input data-id="company" value="${esc(x.company)}" placeholder="Nombre legal o comercial"></div><div><label>Sede o instalación *</label><input data-id="site" value="${esc(x.site)}" placeholder="Ej.: Planta principal"></div>
<div><label>Dirección</label><input data-id="address" value="${esc(x.address)}" placeholder="Dirección completa"></div><div><label>Actividad principal *</label><input data-id="activity" value="${esc(x.activity)}" placeholder="¿Qué se hace en este lugar?"></div>
<div><label>Número máximo de personas *</label><input type="number" min="1" data-id="workers" value="${esc(x.workers)}" placeholder="Trabajadores, visitantes y contratistas"></div><div><label>Turnos y horarios</label><input data-id="shifts" value="${esc(x.shifts)}" placeholder="Ej.: 2 turnos, 07:00 a 23:00"></div>
<div><label>Niveles o pisos</label><input data-id="floors" value="${esc(x.floors)}" placeholder="Ej.: planta baja y piso 1"></div><div><label>Responsable del plan</label><input data-id="owner" value="${esc(x.owner)}" placeholder="Nombre y cargo"></div>
</div><label style="margin-top:12px">Áreas y procesos críticos</label><textarea data-id="areas" placeholder="Describe producción, almacenes, oficinas, salas técnicas y áreas con mayor ocupación.">${esc(x.areas)}</textarea><label style="margin-top:12px">Personas que pueden requerir asistencia</label><textarea data-id="special" placeholder="Movilidad reducida, discapacidad sensorial, embarazo, visitantes, trabajo aislado u otras condiciones.">${esc(x.special)}</textarea></section>${nav("home","hazards")}`}
function hazards(){const p=state.project;return `${head(2,"Identifica las amenazas","Selecciona únicamente situaciones con posibilidad real de generar una emergencia en este centro de trabajo.")}${guide("Amenaza no significa emergencia ocurrida","Es una fuente o condición con potencial de causar daño. Después convertirás cada amenaza relevante en un escenario específico.")}
<section class="panel"><h2>Catálogo orientador</h2><p class="intro">Marca las amenazas aplicables. Puedes personalizarlas indicando dónde se originan y qué controles existen.</p><div class="cards">${HAZARDS.map(h=>{const on=p.hazards.some(x=>x.type===h[0]);return `<label class="choice ${on?"selected":""}"><input type="checkbox" data-hazard="${h[0]}" ${on?"checked":""}><span><b>${h[1]}</b><small>${h[2]}</small></span></label>`}).join("")}</div><div class="actions"><button class="btn soft" id="customHazard">+ Agregar otra amenaza</button></div></section>
<section class="panel"><h2>Amenazas seleccionadas</h2><div class="list">${p.hazards.length?p.hazards.map(h=>`<div class="item"><div class="itemtop"><div><b>${esc(h.name)}</b><p>${esc(h.area||"Ubicación pendiente")} · ${esc(h.cause||"Origen por describir")}</p></div><button class="btn" data-edit-hazard="${h.id}">Completar</button></div></div>`).join(""):'<div class="empty">Selecciona al menos una amenaza para continuar.</div>'}</div></section>${nav("identity","scenarios")}`}
function scenarios(){const p=state.project;return `${head(3,"Construye escenarios de emergencia","Convierte cada amenaza en una situación concreta: qué ocurre, dónde, a quién afecta y cómo puede evolucionar.")}${guide("Evita escribir solamente “incendio”","Un escenario útil describe el evento iniciador, el lugar, las personas expuestas, las consecuencias y las barreras que deberían detener su evolución.")}
<section class="panel"><div class="itemtop"><div><h2>Escenarios del centro de trabajo</h2><p class="intro">Desarrolla como mínimo un escenario prioritario.</p></div><button class="btn primary" id="addScenario">+ Crear escenario</button></div><div class="list">${p.scenarios.length?p.scenarios.map(s=>`<div class="item"><div class="itemtop"><div><span class="pill">${esc(s.code||"ESC")}</span><b style="display:block;margin-top:7px">${esc(s.name)}</b><p><strong>Inicio:</strong> ${esc(s.event)}<br><strong>Expuestos:</strong> ${esc(s.exposed)}</p></div><button class="btn" data-edit-scenario="${s.id}">Editar</button></div></div>`).join(""):'<div class="empty">Todavía no has construido escenarios.</div>'}</div></section>${nav("hazards","resources")}`}
function resources(){const p=state.project;return `${head(4,"Registra capacidades y recursos","Identifica lo que realmente está disponible para prevenir, controlar y responder ante los escenarios.")}${guide("No basta con que el equipo exista","Registra ubicación, estado y responsable. Un recurso inaccesible, vencido o desconocido no puede considerarse una capacidad confiable.")}
<section class="panel"><div class="itemtop"><div><h2>Inventario para emergencias</h2><p class="intro">Incluye sistemas, equipos, suministros y medios de comunicación.</p></div><button class="btn primary" id="addResource">+ Agregar recurso</button></div><div class="list">${p.resources.length?p.resources.map(r=>`<div class="item"><div class="itemtop"><div><b>${esc(r.type)} · ${esc(r.qty||1)}</b><p>${esc(r.location)} · Estado: ${esc(r.status||"sin verificar")}</p></div><button class="btn danger" data-del-resource="${r.id}">Eliminar</button></div></div>`).join(""):'<div class="empty">No hay recursos registrados. Realiza un recorrido por las instalaciones.</div>'}</div></section>${nav("scenarios","organization")}`}
function organization(){const p=state.project;return `${head(5,"Organiza la respuesta","Cada función debe tener una persona titular, un suplente y una forma clara de contacto.")}${guide("Los cargos no responden por sí solos","Asigna personas que conozcan la instalación, tengan formación y puedan estar disponibles durante los turnos considerados.")}
<section class="panel"><div class="itemtop"><div><h2>Responsabilidades</h2><p class="intro">Comienza por coordinación, alarma/comunicación y evacuación.</p></div><button class="btn primary" id="addRole">+ Asignar función</button></div><div class="list">${p.roles.length?p.roles.map(r=>`<div class="item"><div class="itemtop"><div><b>${esc(r.role)}</b><p>Titular: ${esc(r.person)} · Suplente: ${esc(r.backup||"Pendiente")}<br>Contacto: ${esc(r.contact||"Pendiente")}</p></div><button class="btn danger" data-del-role="${r.id}">Eliminar</button></div></div>`).join(""):'<div class="empty">Aún no has asignado responsables.</div>'}</div></section>
<section class="panel"><h2>Comunicación y apoyo externo</h2><div class="grid g2"><div><label>¿Cómo se activa la alarma?</label><textarea data-org="alarm" placeholder="Señal, medio, código y responsable.">${esc(p.organization?.alarm)}</textarea></div><div><label>Contactos externos</label><textarea data-org="contacts" placeholder="Bomberos, ambulancia, apoyo técnico y seguridad.">${esc(p.organization?.contacts)}</textarea></div></div></section>${nav("resources","procedures")}`}
function procedures(){const p=state.project,opts=p.scenarios.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");return `${head(6,"Define procedimientos de actuación","Establece instrucciones específicas para cada escenario, organizadas antes, durante y después.")}${guide("Una instrucción debe poder ejecutarse","Escribe acciones claras, en orden y dentro de las competencias de cada responsable. Evita frases generales como “tomar las medidas necesarias”.")}
<section class="panel"><h2>Procedimiento por escenario</h2>${p.scenarios.length?`<label>Escenario</label><select id="procedureScenario">${opts}</select><div id="procedureFields" style="margin-top:12px"></div>`:'<div class="empty">Primero debes crear al menos un escenario.</div>'}</section>${nav("organization","osiris")}`}
function osiris(){const p=state.project;return `${head(7,"Mapa de emergencia y evacuación","OSIRIS te ayuda a representar salidas, recursos, zonas peligrosas y puntos de encuentro.")}${guide("OSIRIS es un recurso dentro del plan","Carga una imagen del plano o utiliza la cuadrícula. Selecciona un símbolo y toca el lugar donde debe aparecer. Verifica siempre la ubicación mediante un recorrido presencial.")}
<section class="panel osiris"><div class="osirisbrand"><span class="osirismark">O</span><div><h2>OSIRIS</h2><p class="intro">Constructor del mapa de emergencia laboral</p></div></div>
<div class="actions" style="margin-bottom:12px"><label class="btn soft" style="display:inline-flex;align-items:center;margin:0">Cargar plano<input type="file" id="planUpload" accept="image/*" hidden></label><button class="btn danger" id="clearMap">Limpiar mapa</button></div>
<div class="maptools">${Object.entries(MARKERS).map(([k,v])=>`<button class="maptool ${state.mapTool===k?"active":""}" data-maptool="${k}">${v[2]} · ${v[0]}</button>`).join("")}</div>
<div class="canvaswrap" id="mapCanvas">${p.map.image?`<img class="planbg" src="${p.map.image}" alt="Plano cargado">`:""}${p.map.markers.map(m=>`<button class="marker ${MARKERS[m.type][1]}" data-marker="${m.id}" style="left:${m.x}%;top:${m.y}%" title="${MARKERS[m.type][0]}">${MARKERS[m.type][2]}</button>`).join("")}</div>
<div class="legend">${Object.values(MARKERS).map(v=>`<span style="--c:${v[1]==="exit"?"#238447":v[1]==="ext"?"#cf3030":v[1]==="meet"?"#2368a2":v[1]==="hazard"?"#e69200":"#009e81"}">${v[0]}</span>`).join("")}</div>
<div class="callout ${complete("osiris")?"":"warn"}" style="margin-top:13px">${complete("osiris")?"El mapa contiene al menos una salida y un punto de encuentro.":"Para completar este paso debes señalar al menos una salida y un punto de encuentro."}</div></section>${nav("procedures","drills")}`}
function drills(){const x=state.project.drills||{};return `${head(8,"Prepara, practica y mejora","Un plan que no se comunica ni se practica difícilmente funcionará durante una emergencia.")}${guide("El simulacro es una evaluación, no una actuación teatral","Define objetivos observables, registra tiempos y hallazgos, y convierte cada problema detectado en una acción de mejora.")}
<section class="panel"><h2>Programa de preparación</h2><div class="grid g2"><div><label>Frecuencia de capacitación *</label><select data-drill="frequency"><option value="">Selecciona</option><option ${x.frequency==="Semestral"?"selected":""}>Semestral</option><option ${x.frequency==="Anual"?"selected":""}>Anual</option><option ${x.frequency==="Al ingreso y anual"?"selected":""}>Al ingreso y anual</option></select></div><div><label>Próximo simulacro *</label><input type="date" data-drill="nextDate" value="${esc(x.nextDate)}"></div><div><label>Escenario a evaluar</label><input data-drill="scenario" value="${esc(x.scenario)}" placeholder="Ej.: incendio en almacén"></div><div><label>Objetivo del ejercicio</label><input data-drill="objective" value="${esc(x.objective)}" placeholder="Ej.: verificar alarma y tiempo de evacuación"></div></div><label style="margin-top:12px">Criterios de evaluación</label><textarea data-drill="criteria" placeholder="Activación de alarma, tiempo, comportamiento, conteo, comunicación y uso de rutas.">${esc(x.criteria)}</textarea><label style="margin-top:12px">Cómo se gestionarán los hallazgos</label><textarea data-drill="improvement" placeholder="Responsables, fechas de cierre y verificación.">${esc(x.improvement)}</textarea></section>${nav("osiris","review")}`}
function review(){const checks=STEPS.slice(1,-1).map(s=>({name:s.n,ok:complete(s.id),sub:s.sub})),ready=checks.every(x=>x.ok),p=state.project;return `${head(9,"Revisa y genera el plan","Comprueba la coherencia de la información antes de aprobar y descargar el documento.")}${guide("El documento no reemplaza la verificación en campo","Recorre la instalación, consulta a trabajadores, valida rutas y recursos, y somete el plan a revisión y aprobación de la organización.")}
<section class="panel"><h2>Control de integridad</h2><div class="review">${checks.map(c=>`<div class="reviewrow ${c.ok?"ok":""}"><i>${c.ok?"✓":"!"}</i><div><b>${c.name}</b><span style="display:block">${c.sub}</span></div><span>${c.ok?"Completo":"Pendiente"}</span></div>`).join("")}</div></section>
<section class="panel"><h2>Aprobación y salida</h2><div class="callout ${ready?"":"warn"}">${ready?"La información mínima está completa. Puedes declarar la revisión y generar el plan.":"Aún existen secciones pendientes. Puedes revisar el borrador, pero completa los pasos señalados antes de aprobarlo."}</div><div class="grid g2" style="margin-top:13px"><div><label>Elaborado por</label><input data-approval="prepared" value="${esc(p.approval?.prepared||p.identity.owner)}"></div><div><label>Aprobado por</label><input data-approval="approved" value="${esc(p.approval?.approved)}" placeholder="Nombre y cargo"></div><div><label>Fecha de revisión</label><input type="date" data-approval="date" value="${esc(p.approval?.date)}"></div><div><label>Próxima revisión</label><input type="date" data-approval="next" value="${esc(p.approval?.next)}"></div></div><div class="actions"><button class="btn soft" id="approveBtn" ${ready?"":"disabled"}>✓ Marcar como revisado</button><button class="btn primary" id="pdfBtn">Descargar plan en PDF</button><button class="btn" onclick="window.print()">Imprimir</button></div></section>${nav("drills","home","Finalizar")}`}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll("[data-help]").forEach(b=>b.onclick=()=>toast("Lee la guía azul del paso y completa los campos con información verificada en el lugar de trabajo."));
 if($("startBtn"))$("startBtn").onclick=()=>go(state.project?"identity":"identity");if($("plansHomeBtn"))$("plansHomeBtn").onclick=openProjects;
 document.querySelectorAll("[data-id]").forEach(e=>e.onchange=()=>{state.project.identity[e.dataset.id]=e.value;save()});
 document.querySelectorAll("[data-hazard]").forEach(e=>e.onchange=()=>toggleHazard(e.dataset.hazard,e.checked));
 document.querySelectorAll("[data-edit-hazard]").forEach(e=>e.onclick=()=>hazardModal(e.dataset.editHazard));if($("customHazard"))$("customHazard").onclick=()=>hazardModal();
 if($("addScenario"))$("addScenario").onclick=()=>scenarioModal();document.querySelectorAll("[data-edit-scenario]").forEach(e=>e.onclick=()=>scenarioModal(e.dataset.editScenario));
 if($("addResource"))$("addResource").onclick=resourceModal;document.querySelectorAll("[data-del-resource]").forEach(e=>e.onclick=()=>{state.project.resources=state.project.resources.filter(x=>x.id!==e.dataset.delResource);save();render()});
 if($("addRole"))$("addRole").onclick=roleModal;document.querySelectorAll("[data-del-role]").forEach(e=>e.onclick=()=>{state.project.roles=state.project.roles.filter(x=>x.id!==e.dataset.delRole);save();render()});
 document.querySelectorAll("[data-org]").forEach(e=>e.onchange=()=>{state.project.organization=state.project.organization||{};state.project.organization[e.dataset.org]=e.value;save()});
 if($("procedureScenario")){$("procedureScenario").onchange=renderProcedureFields;renderProcedureFields()}
 document.querySelectorAll("[data-maptool]").forEach(b=>b.onclick=()=>{state.mapTool=b.dataset.maptool;render()});if($("mapCanvas"))$("mapCanvas").onclick=addMarker;document.querySelectorAll("[data-marker]").forEach(b=>b.onclick=e=>{e.stopPropagation();state.project.map.markers=state.project.map.markers.filter(m=>m.id!==b.dataset.marker);save();render()});
 if($("planUpload"))$("planUpload").onchange=uploadPlan;if($("clearMap"))$("clearMap").onclick=()=>{if(confirm("¿Eliminar el plano y todos los símbolos?")){state.project.map={image:"",markers:[]};save();render()}};
 document.querySelectorAll("[data-drill]").forEach(e=>e.onchange=()=>{state.project.drills[e.dataset.drill]=e.value;save()});document.querySelectorAll("[data-approval]").forEach(e=>e.onchange=()=>{state.project.approval=state.project.approval||{};state.project.approval[e.dataset.approval]=e.value;save()});
 if($("approveBtn"))$("approveBtn").onclick=()=>{state.project.reviewed=true;save();render();toast("Plan marcado como revisado.")};if($("pdfBtn"))$("pdfBtn").onclick=generatePdf;
}
function toggleHazard(type,on){const h=HAZARDS.find(x=>x[0]===type);if(on&&!state.project.hazards.some(x=>x.type===type))state.project.hazards.push({id:"h"+Date.now(),type,name:h[1],area:"",cause:"",controls:""});if(!on)state.project.hazards=state.project.hazards.filter(x=>x.type!==type);save();render()}
function showModal(title,html,onSave){$("modalTitle").textContent=title;$("modalBody").innerHTML=html;$("modal").classList.remove("hidden");$("modalClose").onclick=closeModal;const b=$("modalSave");if(b)b.onclick=onSave}function closeModal(){$("modal").classList.add("hidden")}
function hazardModal(id){const h=state.project.hazards.find(x=>x.id===id)||{id:"h"+Date.now(),type:"otro",name:"",area:"",cause:"",controls:""};showModal(id?"Completar amenaza":"Agregar amenaza",`<label>Nombre de la amenaza</label><input id="mhName" value="${esc(h.name)}"><label style="margin-top:10px">¿Dónde puede originarse?</label><input id="mhArea" value="${esc(h.area)}" placeholder="Área, equipo, proceso o entorno"><label style="margin-top:10px">¿Qué podría iniciarla?</label><textarea id="mhCause" placeholder="Condiciones, materiales, energías o eventos.">${esc(h.cause)}</textarea><label style="margin-top:10px">Controles existentes</label><textarea id="mhControls" placeholder="Prevención, detección, contención y respuesta.">${esc(h.controls)}</textarea><button class="btn primary" id="modalSave" style="width:100%;margin-top:14px">Guardar amenaza</button>`,()=>{h.name=$("mhName").value.trim();h.area=$("mhArea").value.trim();h.cause=$("mhCause").value.trim();h.controls=$("mhControls").value.trim();if(!h.name)return toast("Indica el nombre.");if(!id)state.project.hazards.push(h);save();closeModal();render()})}
function scenarioModal(id){if(!state.project.hazards.length)return toast("Primero identifica una amenaza.");const s=state.project.scenarios.find(x=>x.id===id)||{id:"s"+Date.now(),code:"ESC-"+(state.project.scenarios.length+1),hazardId:state.project.hazards[0].id,name:"",event:"",evolution:"",exposed:"",consequences:"",barriers:""};showModal(id?"Editar escenario":"Crear escenario",`<div class="grid g2"><div><label>Código</label><input id="msCode" value="${esc(s.code)}"></div><div><label>Amenaza relacionada</label><select id="msHazard">${state.project.hazards.map(h=>`<option value="${h.id}" ${h.id===s.hazardId?"selected":""}>${esc(h.name)}</option>`).join("")}</select></div></div><label style="margin-top:10px">Nombre del escenario</label><input id="msName" value="${esc(s.name)}" placeholder="Ej.: Incendio en almacén durante turno nocturno"><label style="margin-top:10px">Evento iniciador</label><textarea id="msEvent">${esc(s.event)}</textarea><label style="margin-top:10px">Cómo podría evolucionar</label><textarea id="msEvolution">${esc(s.evolution)}</textarea><label style="margin-top:10px">Personas, bienes y procesos expuestos</label><textarea id="msExposed">${esc(s.exposed)}</textarea><label style="margin-top:10px">Consecuencias posibles</label><textarea id="msCons">${esc(s.consequences)}</textarea><label style="margin-top:10px">Barreras críticas</label><textarea id="msBarriers">${esc(s.barriers)}</textarea><button class="btn primary" id="modalSave" style="width:100%;margin-top:14px">Guardar escenario</button>`,()=>{Object.assign(s,{code:$("msCode").value.trim(),hazardId:$("msHazard").value,name:$("msName").value.trim(),event:$("msEvent").value.trim(),evolution:$("msEvolution").value.trim(),exposed:$("msExposed").value.trim(),consequences:$("msCons").value.trim(),barriers:$("msBarriers").value.trim()});if(!s.name||!s.event||!s.exposed)return toast("Completa nombre, evento iniciador y exposición.");if(!id)state.project.scenarios.push(s);save();closeModal();render()})}
function resourceModal(){showModal("Agregar recurso",`<label>Tipo</label><select id="mrType">${RESOURCE_TYPES.map(x=>`<option>${x}</option>`).join("")}</select><div class="grid g2" style="margin-top:10px"><div><label>Cantidad</label><input id="mrQty" type="number" min="1" value="1"></div><div><label>Estado</label><select id="mrStatus"><option>Operativo</option><option>Requiere revisión</option><option>Fuera de servicio</option></select></div></div><label style="margin-top:10px">Ubicación</label><input id="mrLoc"><label style="margin-top:10px">Responsable o fecha de inspección</label><input id="mrResp"><button class="btn primary" id="modalSave" style="width:100%;margin-top:14px">Agregar</button>`,()=>{if(!$("mrLoc").value.trim())return toast("Indica la ubicación.");state.project.resources.push({id:"r"+Date.now(),type:$("mrType").value,qty:$("mrQty").value,status:$("mrStatus").value,location:$("mrLoc").value.trim(),responsible:$("mrResp").value.trim()});save();closeModal();render()})}
function roleModal(){showModal("Asignar responsabilidad",`<label>Función</label><select id="moRole">${ROLE_TYPES.map(x=>`<option>${x}</option>`).join("")}</select><label style="margin-top:10px">Persona titular</label><input id="moPerson"><label style="margin-top:10px">Suplente</label><input id="moBackup"><label style="margin-top:10px">Contacto</label><input id="moContact"><button class="btn primary" id="modalSave" style="width:100%;margin-top:14px">Guardar asignación</button>`,()=>{if(!$("moPerson").value.trim())return toast("Indica la persona titular.");state.project.roles.push({id:"o"+Date.now(),role:$("moRole").value,person:$("moPerson").value.trim(),backup:$("moBackup").value.trim(),contact:$("moContact").value.trim()});save();closeModal();render()})}
function renderProcedureFields(){const id=$("procedureScenario").value,x=state.project.procedures[id]||{};$("procedureFields").innerHTML=`<label>ANTES · Prevención y preparación</label><textarea id="prBefore" placeholder="Inspecciones, mantenimiento, capacitación y controles.">${esc(x.before)}</textarea><label style="margin-top:10px">DURANTE · Respuesta inmediata</label><textarea id="prDuring" placeholder="Detección, alarma, notificación, evacuación, atención y control inicial.">${esc(x.during)}</textarea><label style="margin-top:10px">DESPUÉS · Recuperación y mejora</label><textarea id="prAfter" placeholder="Conteo, atención, evaluación, investigación, recuperación y actualización.">${esc(x.after)}</textarea><button class="btn primary" id="saveProcedure" style="margin-top:12px">Guardar procedimiento</button>`;$("saveProcedure").onclick=()=>{state.project.procedures[id]={before:$("prBefore").value.trim(),during:$("prDuring").value.trim(),after:$("prAfter").value.trim()};save();toast("Procedimiento guardado.")}}
function uploadPlan(e){const f=e.target.files[0];if(!f)return;if(f.size>2500000)return toast("Usa una imagen menor de 2,5 MB.");const r=new FileReader();r.onload=()=>{state.project.map.image=r.result;save();render()};r.readAsDataURL(f)}
function addMarker(e){if(e.target.closest(".marker"))return;const r=e.currentTarget.getBoundingClientRect();state.project.map.markers.push({id:"m"+Date.now(),type:state.mapTool,x:Math.round((e.clientX-r.left)/r.width*1000)/10,y:Math.round((e.clientY-r.top)/r.height*1000)/10});save();render()}
function openProjects(){const rows=state.projects.map(p=>`<div class="item"><div class="itemtop"><div><b>${esc(p.identity?.company||"Plan sin nombre")}</b><p>${esc(p.identity?.site||"Sede pendiente")} · ${new Date(p.updated||p.created).toLocaleDateString("es")}</p></div><div class="actions" style="margin:0"><button class="btn" data-open-project="${p.id}">Abrir</button><button class="btn danger" data-delete-project="${p.id}">Eliminar</button></div></div></div>`).join("");showModal("Mis planes",`<div class="actions"><button class="btn primary" id="newProject">+ Crear nuevo plan</button></div><div class="list" style="margin-top:12px">${rows||'<div class="empty">No hay planes guardados.</div>'}</div>`);$("newProject").onclick=()=>{state.project=blankProject();state.projects.unshift(state.project);save();closeModal();go("identity")};document.querySelectorAll("[data-open-project]").forEach(b=>b.onclick=()=>{state.project=state.projects.find(p=>p.id===b.dataset.openProject);closeModal();render()});document.querySelectorAll("[data-delete-project]").forEach(b=>b.onclick=()=>{if(!confirm("¿Eliminar este plan?"))return;state.projects=state.projects.filter(p=>p.id!==b.dataset.deleteProject);state.project=state.projects[0]||null;localStorage.setItem(DB_KEY,JSON.stringify(state.projects));closeModal();render()})}
async function generatePdf(){const p=state.project,{jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),margin=14;let y=18;const newPage=()=>{doc.addPage();y=18},checkY=n=>{if(y+n>276)newPage()},title=t=>{checkY(14);doc.setFontSize(13);doc.setTextColor(0,32,91);doc.setFont(undefined,"bold");doc.text(t,margin,y);doc.setFont(undefined,"normal");y+=7},para=t=>{const lines=doc.splitTextToSize(String(t||"—"),180);checkY(lines.length*4+3);doc.setFontSize(8.5);doc.setTextColor(71,85,105);doc.text(lines,margin,y);y+=lines.length*4+3},table=(h,b)=>{checkY(30);doc.autoTable({startY:y,head:[h],body:b,theme:"grid",styles:{fontSize:7.2,cellPadding:1.8,overflow:"linebreak"},headStyles:{fillColor:[0,123,133]},margin:{left:margin,right:margin}});y=doc.lastAutoTable.finalY+7};
doc.setFillColor(0,32,91);doc.rect(0,0,210,45,"F");doc.setTextColor(255);doc.setFontSize(22);doc.setFont(undefined,"bold");doc.text("Plan de Emergencia Laboral",margin,21);doc.setFontSize(11);doc.setFont(undefined,"normal");doc.text(p.identity.company||"Organización",margin,29);doc.setTextColor(157,229,231);doc.text("La Movida de SST Plus · De la Reacción a la Prevención",margin,37);y=55;
title("1. Identificación y alcance");table(["Campo","Información"],[["Empresa",p.identity.company||"—"],["Sede",p.identity.site||"—"],["Dirección",p.identity.address||"—"],["Actividad",p.identity.activity||"—"],["Personas",p.identity.workers||"—"],["Turnos",p.identity.shifts||"—"],["Responsable",p.identity.owner||"—"]]);title("Caracterización");para("Áreas y procesos críticos: "+(p.identity.areas||"—"));para("Personas que requieren asistencia: "+(p.identity.special||"—"));
title("2. Amenazas identificadas");table(["Amenaza","Ubicación/origen","Controles existentes"],p.hazards.length?p.hazards.map(h=>[h.name,h.area+" · "+h.cause,h.controls||"—"]):[["—","Sin datos","—"]]);
title("3. Escenarios de emergencia");table(["Código / escenario","Evento y evolución","Exposición / consecuencias"],p.scenarios.length?p.scenarios.map(s=>[s.code+" · "+s.name,s.event+" · "+s.evolution,s.exposed+" · "+s.consequences]):[["—","Sin datos","—"]]);
title("4. Recursos y capacidades");table(["Recurso","Ubicación","Estado"],p.resources.length?p.resources.map(r=>[r.type+" · "+r.qty,r.location,r.status]):[["—","Sin datos","—"]]);
title("5. Organización para emergencias");table(["Función","Titular / suplente","Contacto"],p.roles.length?p.roles.map(r=>[r.role,r.person+" / "+(r.backup||"—"),r.contact||"—"]):[["—","Sin datos","—"]]);para("Alarma: "+(p.organization?.alarm||"—"));para("Apoyo externo: "+(p.organization?.contacts||"—"));
title("6. Procedimientos");p.scenarios.forEach(s=>{const x=p.procedures[s.id]||{};para(s.code+" · "+s.name);table(["Momento","Acciones"],[["Antes",x.before||"—"],["Durante",x.during||"—"],["Después",x.after||"—"]])});
title("7. Evacuación y mapa OSIRIS");para("El mapa digital contiene "+p.map.markers.length+" símbolos: "+Object.entries(MARKERS).map(([k,v])=>v[0]+" ("+p.map.markers.filter(m=>m.type===k).length+")").join(", ")+". Debe validarse mediante recorrido presencial e incorporarse como anexo gráfico.");
title("8. Capacitación y simulacros");table(["Elemento","Definición"],[["Frecuencia",p.drills.frequency||"—"],["Próximo simulacro",p.drills.nextDate||"—"],["Escenario",p.drills.scenario||"—"],["Objetivo",p.drills.objective||"—"],["Criterios",p.drills.criteria||"—"],["Mejora",p.drills.improvement||"—"]]);
title("9. Control del documento");table(["Elaborado por","Aprobado por","Revisión","Próxima revisión"],[[p.approval?.prepared||"—",p.approval?.approved||"—",p.approval?.date||"—",p.approval?.next||"—"]]);
const pages=doc.getNumberOfPages();for(let i=1;i<=pages;i++){doc.setPage(i);doc.setDrawColor(219,228,234);doc.line(margin,286,196,286);doc.setFontSize(7.5);doc.setTextColor(100,116,139);doc.text("La Movida de SST Plus · www.movidasst.com",margin,291);doc.text("Página "+i+" de "+pages,196,291,{align:"right"})}doc.save("plan-emergencia-"+(p.identity.site||"laboral").replace(/\s+/g,"-").toLowerCase()+".pdf")}
async function login(){const cedula=$("loginDoc").value.trim(),codigo=$("loginCode").value.trim();if(!cedula||!codigo)return toast("Ingresa documento y código.");$("loginBtn").disabled=true;$("loginBtn").textContent="Verificando…";try{const{data,error}=await sb.functions.invoke("validar-integrante",{body:{cedula,codigo}});if(error)throw error;if(data?.ok===false)throw new Error(data.error||"Datos no válidos");const member=data?.integrante||data?.member||data?.usuario||(data?.id?data:null);if(!member?.id)throw new Error("No fue posible identificar al integrante.");state.member=member;localStorage.setItem(MEMBER_KEY,JSON.stringify({member,cedula,codigo}));$("accessGate").classList.add("hidden");toast("Acceso correcto.")}catch(e){toast("No se pudo validar: "+(e.message||"revisa los datos"))}finally{$("loginBtn").disabled=false;$("loginBtn").textContent="Ingresar y comenzar"}}
function account(){showModal("Mi cuenta",`<p><b>${esc((state.member?.nombres||"")+" "+(state.member?.apellidos||""))}</b></p><p class="hint">Tus planes se guardan en este dispositivo.</p><button class="btn danger" id="logoutBtn">Cerrar sesión</button>`);$("logoutBtn").onclick=()=>{localStorage.removeItem(MEMBER_KEY);state.member=null;closeModal();$("accessGate").classList.remove("hidden")}}
function init(){load();try{const a=JSON.parse(localStorage.getItem(MEMBER_KEY)||"null");if(a?.member){state.member=a.member;$("accessGate").classList.add("hidden")}}catch{}$("loginBtn").onclick=login;$("loginCode").onkeydown=e=>{if(e.key==="Enter")login()};$("projectsBtn").onclick=openProjects;$("accountBtn").onclick=account;$("brandHome").onclick=e=>{e.preventDefault();go("home")};render()}
init();
</script>
